data:
  max_seq_length: 128
  tokenizer_name: aubmindlab/bert-base-arabertv02
model:
  d_conv: 4
  d_model: 512
  d_state: 16
  dropout: 0.1
  expand: 2
  gradient_checkpointing: false
  max_position_embeddings: 512
  n_layer: 12
paths:
  output_dir: results_finetune/ablation_no_pretrain/anercorp
task:
  name: anercorp
training:
  batch_size: 4
  epochs: 5
  eval_batch_size: 32
  fp16: true
  lr: 2.0e-05
  max_grad_norm: 1.0
  num_workers: 4
  seed: 42
  warmup_steps: 50
  weight_decay: 0.01
