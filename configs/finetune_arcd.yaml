task:
  name: "arcd"

pretrained_ckpt: "checkpoint/latest.pt"

model:
  d_model: 512
  n_layer: 12
  d_state: 16
  d_conv: 4
  expand: 2
  max_position_embeddings: 512
  dropout: 0.1
  gradient_checkpointing: false

training:
  batch_size: 8         # QA sequences (question+context) run longer
  eval_batch_size: 16
  lr: 3.0e-5
  weight_decay: 0.01
  epochs: 25             # bumped from 15 -- ARCD is tiny (~700 examples),
                          # dev F1 was still climbing at epoch 14/15 last run
  warmup_steps: 50       # ~10% of total steps at single-GPU step counts;
                          # last run had no warmup and showed loss instability
                          # around epoch 6 -- too few total steps + no warmup
  fp16: true
  seed: 42
  num_workers: 4

data:
  tokenizer_name: "aubmindlab/bert-base-arabertv02"
  max_seq_length: 512   # keep full 512 here, contexts are Wikipedia paragraphs

paths:
  output_dir: "results_finetune/arcd"
