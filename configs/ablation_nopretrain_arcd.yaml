task:
  name: arcd
model:
  d_model: 512
  n_layer: 12
  d_state: 16
  d_conv: 4
  expand: 2
  max_position_embeddings: 512
  dropout: 0.1
  gradient_checkpointing: false
training:
  batch_size: 8
  eval_batch_size: 16
  lr: 3.0e-05
  weight_decay: 0.01
  epochs: 10
  warmup_steps: 50
  fp16: true
  seed: 42
  num_workers: 4
data:
  tokenizer_name: aubmindlab/bert-base-arabertv02
  max_seq_length: 384
paths:
  output_dir: results_finetune/ablation_no_pretrain/arcd
